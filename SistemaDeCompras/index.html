<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lojinha De Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="cabecalho">
            <h1>Loja de Games</h1>
            <p>Faça seu pedido abaixo e seja feliz com a melhor loja de games da cidade.</p>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="grid">
                <div class="card">
                    <h2>1. Cadastre seu pedido</h2>
                    <label for="name">Digite Seu Nome Completo</label>
                    <input type="text" name="nome" id="nome" placeholder="Nome Completo">
                    <p class="erro erron"></p>
                    <label for="prod">Selecione o Produto</label>
                    <select name="produto" id="produto">
                        <option value="default" disabled selected>Selecione Seu Jogo...</option>
                    </select>
                    <p class="erro errop"></p>
                    <label for="qntdl">Digite a Quantidade</label>
                    <input type="number" name="qtnd" id="qtnd" placeholder="Quantidade" min="1">
                    <p class="erro erroq"></p>
                    <label for="tipo">Forma de Entrega</label>
                    <label id="tipo"><input type="radio" name="modalidade" id="entrega" value="Entrega">Entrega</label>
                    <label id="tipo"><input type="radio" name="modalidade" id="retirada" value="Retirada">Retirada</label><br>
                    <p class="erro errof"></p>
                    <div class="botoes cadastro">
                        <button id="calcular" onclick="testarInputs()">Calcular Pedido</button>
                        <button id="limpar" onclick="limparItems()">Limpar</button>
                    </div>
                </div>
                <div class="card">
                    <div class="confirmar">
                        <h2>2. Confirmação do Pedido</h2>
                        <div class="calculado">
                            <p>Preencha os dados e clique em <span id="destacar">Calcular Pedido</span></p>
                        </div>
                        <div class="botoes conf disabled">
                            <button id="confirmar" onclick="confirmarPedido()">Confirmar Pedido</button>
                            <button id="novopedido" onclick="novoPedido()">Novo Pedido</button>
                        </div>
                    </div>
                </div>
                <div class="cardgrande">
                    <div class="titulocard">
                        <h1>Pedidos Registrados</h1>
                        <h4>Quantidade de pedidos confirmados</h4>
                    </div>
                    <div class="contador">
                        <h1 id="contadora">0</h1>
                    </div>
                </div>
                <div class="card finalizado">
                    <h2>Pedido Finalizado</h2>
                    <div class="informacoes">
                        
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
